name: Windows build
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug build and checks
        shell: cmd
        run: soul\port\build.bat
      - name: Release build and package
        shell: cmd
        run: soul\port\build_dist.bat
      - uses: actions/upload-artifact@v4
        with:
          name: soul-of-darkness-windows
          path: soul/port/dist/
